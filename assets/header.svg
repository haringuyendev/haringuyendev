    <rect width="1200" height="260" fill="url(#grid)" />

    <circle cx="150" cy="50" r="140" fill="#06B6D4" opacity="0.12" />
    <circle cx="1060" cy="210" r="180" fill="#6366F1" opacity="0.14" />

    <path d="M0,185 C260,235 480,145 760,195 C960,230 1090,175 1200,190 L1200,260 L0,260 Z" fill="url(#waveGrad2)" />
    <path d="M0,205 C280,165 540,245 840,190 C1020,160 1120,210 1200,195 L1200,260 L0,260 Z" fill="url(#waveGrad1)" />

    <rect x="40" y="28" width="150" height="28" rx="14" fill="#0F172A" fill-opacity="0.7" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="58" cy="42" r="4" fill="#22D3EE" />
    <text x="70" y="47" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" fill="#E0F2FE">@haringuyendev</text>

    <rect x="480" y="54" width="240" height="4" rx="2" fill="url(#accentGrad)" />

    <text x="600" y="114" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">Hai Nguyen</text>

    <text x="600" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#BAE6FD">Senior Fullstack &amp; AI Systems Engineer</text>

    <text x="600" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="500" fill="#94A3B8">Clean Architecture  •  Microservices  •  AI-Native SDLC  •  haringuyen.site</text>
